[project]
name = "backend_template"
version = "0.1.0"
description = "Default template for PDM package"
requires-python = ">=3.9"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "drf-spectacular>=0.28",
    "django-filter>=25.1",
    "django-cors-headers>=4.7",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "django-unfold>=0.60",
    "django-simple-history>=3.10",
    "django-safedelete>=1.4",
    "celery>=5.5",
    "redis>=5.0",
    "dj-database-url>=3.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "amqp==5.4.1",
    "asgiref==3.12.1",
    "async-timeout==5.0.1; python_full_version < \"3.11.3\"",
    "attrs==26.1.0",
    "billiard==4.3.1",
    "celery==5.6.3",
    "click==8.5.0",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.4.1",
    "dj-database-url==3.1.2",
    "django==5.2.18",
    "django-cors-headers==4.9.0",
    "django-filter==26.2",
    "django-safedelete==1.5.0",
    "django-simple-history==3.13.0",
    "django-unfold==0.91.0",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "gunicorn==26.2.0",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kombu==5.6.2",
    "packaging==26.3",
    "prompt-toolkit==3.0.53",
    "psycopg2-binary==2.9.13",
    "pyjwt==2.15.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "six==1.17.0",
    "sqlparse==0.6.0",
    "typing-extensions==4.16.0",
    "tzdata==2026.5",
    "tzlocal==5.4.4",
    "uritemplate==4.2.0",
    "vine==5.1.0",
    "wcwidth==0.9.2",
    "whitenoise==6.12.0",
]
authors = [
    {name = "davi-prussek", email = "davi.prussek@estudantes.ifc.edu.br"},
]
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pytest-env>=1.1",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "django-extensions>=4.1",
    "pydot>=3.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
post_install = "git config core.hooksPath .githooks"
hooks = "git config core.hooksPath .githooks"
dev = "python src/manage.py runserver"
runserver = "python src/manage.py runserver"
redis = "docker compose up -d redis"
redis-down = "docker compose down"
celery = "celery -A src.config worker --loglevel=INFO --concurrency=10 -n worker1.%h --pool=solo --without-gossip"
beat = "celery -A src.config beat --loglevel=INFO"
migrate = "python src/manage.py migrate"
makemigrations = "python src/manage.py makemigrations"
createsuperuser = "python src/manage.py createsuperuser"
shell = "python src/manage.py shell"
startapp = "python src/manage.py startapp {args}"
loaddata = "python src/manage.py loaddata {args}"
dumpdata = "python src/manage.py dumpdata {args}"
model = "python src/manage.py graph_models items users --dot -o models.dot"
test = "pytest {args}"
test-cov = "pytest --cov=src --cov-report=term-missing {args}"
check = "ruff check ."
format = "ruff format ."
export = "pdm export --prod -f requirements --without-hashes -o requirements.txt"

[tool.pytest.ini_options]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
env = [
    "DEBUG=True",
    "SECRET_KEY=chave-apenas-para-testes",
    "DATABASE_URL=",
    "REDIS_URL=",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
