openapi: 3.0.3
info:
  title: API
  version: 1.0.0
  description: Documentação da API
paths:
  /api/:
    get:
      operationId: root_retrieve
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/alunos/:
    get:
      operationId: alunos_list
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: turma
        schema:
          type: integer
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoList'
          description: ''
    post:
      operationId: alunos_create
      tags:
      - alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlunoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /api/alunos/{id}/:
    get:
      operationId: alunos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aluno.
        required: true
      tags:
      - alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    put:
      operationId: alunos_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aluno.
        required: true
      tags:
