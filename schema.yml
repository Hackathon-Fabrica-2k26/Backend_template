components:
  schemas:
    Aluno:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 45
        matricula:
          type: string
          title: Matrícula
          maxLength: 50
        nascimento:
          type: string
          format: date
          nullable: true
          title: Data de nascimento
        idade:
          type: integer
          nullable: true
          readOnly: true
        ativo:
          type: boolean
        turma:
          type: integer
        meta_dados:
          type: integer
          nullable: true
        responsavel:
          type: integer
          nullable: true
          title: Responsável
        resumo:
          allOf:
          - $ref: '#/components/schemas/AlunoResumo'
          readOnly: true
      required:
      - id
      - idade
      - nome
      - resumo
      - turma
    AlunoRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 45
        matricula:
          type: string
          title: Matrícula
          maxLength: 50
        nascimento:
          type: string
          format: date
          nullable: true
          title: Data de nascimento
        ativo:
          type: boolean
        turma:
          type: integer
        meta_dados:
          type: integer
          nullable: true
        responsavel:
          type: integer
          nullable: true
          title: Responsável
      required:
      - nome
      - turma
    AlunoResumo:
      type: object
      properties:
        relatorios:
          type: integer
        trabalhos:
          type: integer
        observacoes_pendentes:
          type: integer
      required:
      - observacoes_pendentes
      - relatorios
      - trabalhos
    Atividade:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        turma:
          type: integer
        criada_por:
          type: integer
          readOnly: true
        titulo:
          type: string
          title: Título
          maxLength: 255
        origem:
          $ref: '#/components/schemas/AtividadeOrigemEnum'
        texto_original:
          type: string
        objetivo:
          type: string
        status:
          $ref: '#/components/schemas/AtividadeStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - created_at
      - criada_por
      - id
      - texto_original
      - titulo
      - turma
      - updated_at
    AtividadeExtrairResposta:
      type: object
      description: Resposta da extração de arquivo com sugestão de IA.
      properties:
        titulo:
          type: string
        descricao:
          type: string
        texto_original:
          type: string
        origem:
          $ref: '#/components/schemas/AtividadeExtrairRespostaOrigemEnum'
      required:
      - descricao
      - origem
      - texto_original
      - titulo
    AtividadeExtrairRespostaOrigemEnum:
      enum:
      - pdf
      - docx
      - jpg
      - png
      - webp
      type: string
      description: |-
        * `pdf` - pdf
        * `docx` - docx
        * `jpg` - jpg
        * `png` - png
        * `webp` - webp
    AtividadeExtrairUploadRequest:
      type: object
      description: Schema específico para documentar o upload binário.
      properties:
        arquivo:
          type: string
          format: binary
        turma:
          type: integer
          nullable: true
      required:
      - arquivo
    AtividadeOrigemEnum:
      enum:
      - texto
      - pdf
      - docx
      type: string
      description: |-
        * `texto` - Texto
        * `pdf` - PDF
        * `docx` - DOCX
    AtividadeRequest:
      type: object
      properties:
        turma:
          type: integer
        titulo:
          type: string
          minLength: 1
          title: Título
          maxLength: 255
        origem:
          $ref: '#/components/schemas/AtividadeOrigemEnum'
        texto_original:
          type: string
          minLength: 1
        objetivo:
          type: string
        descricao:
          type: string
          writeOnly: true
        status:
          $ref: '#/components/schemas/AtividadeStatusEnum'
      required:
      - texto_original
      - titulo
      - turma
    AtividadeStatusEnum:
      enum:
      - rascunho
      - variacoes_geradas
      - aprovada
      - encerrada
      type: string
      description: |-
        * `rascunho` - Rascunho
        * `variacoes_geradas` - Variações geradas
        * `aprovada` - Aprovada
        * `encerrada` - Encerrada
    AtividadeVariacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        atividade:
          type: integer
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Número
        rotulo:
          type: string
          title: Rótulo
          maxLength: 40
        eh_geral:
          type: boolean
          title: É versão geral
        conteudo:
          type: string
          title: Conteúdo
        status:
          $ref: '#/components/schemas/AtividadeVariacaoStatusEnum'
        editada_manual:
          type: boolean
          title: Editada manualmente
        aprovada_por:
          type: integer
          readOnly: true
          nullable: true
        aprovada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        alunos:
          type: array
          items:
            type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - aprovada_em
      - aprovada_por
      - atividade
      - conteudo
      - created_at
      - id
      - numero
      - rotulo
      - updated_at
    AtividadeVariacaoRequest:
      type: object
      properties:
        atividade:
          type: integer
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Número
        rotulo:
          type: string
          minLength: 1
          title: Rótulo
          maxLength: 40
        eh_geral:
          type: boolean
          title: É versão geral
        conteudo:
          type: string
          minLength: 1
          title: Conteúdo
        status:
          $ref: '#/components/schemas/AtividadeVariacaoStatusEnum'
        editada_manual:
          type: boolean
          title: Editada manualmente
        alunos:
          type: array
          items:
            type: integer
      required:
      - atividade
      - conteudo
      - numero
      - rotulo
    AtividadeVariacaoStatusEnum:
      enum:
      - rascunho
      - aprovada
      - descartada
      type: string
      description: |-
        * `rascunho` - Rascunho
        * `aprovada` - Aprovada
        * `descartada` - Descartada
    BlankEnum:
      enum:
      - ''
    ChamadaReconhecerRequest:
      type: object
      description: Valida o arquivo de imagem enviado no multipart/form-data.
      properties:
        imagem:
          type: string
          format: binary
      required:
      - imagem
    ChamadaReconhecerResposta:
      type: object
      description: Lista de nomes reconhecidos na imagem da chamada.
      properties:
        nomes:
          type: array
          items:
            type: string
      required:
      - nomes
    Config:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        modelo:
          type: string
          maxLength: 45
        campos_form: {}
      required:
      - id
      - modelo
    ConfigRequest:
      type: object
      properties:
        api_key:
          type: string
