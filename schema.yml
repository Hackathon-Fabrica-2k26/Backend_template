  /api/atividades/:
    get:
      operationId: atividades_list
      description: Retorna as atividades das turmas do professor autenticado.
      summary: Listar atividades
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
        description: Ordena por `titulo`, `-titulo`, `created_at` ou `-created_at`.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Busca textual por título ou objetivo da atividade.
      - in: query
        name: turma
        schema:
          type: integer
        description: Filtra atividades pelo ID da turma.
      tags:
      - atividades
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAtividadeList'
          description: ''
    post:
      operationId: atividades_create
      summary: Criar atividade
      tags:
      - atividades
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtividadeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AtividadeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AtividadeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atividade'
          description: ''
  /api/atividades/{id}/:
