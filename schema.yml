  /api/atividades/{id}/trabalhos/:
    post:
      operationId: atividades_trabalhos_create
      description: Recebe múltiplos arquivos (PDF, PNG, JPG, WEBP ou DOCX até 20 MB
        cada), analisa em memória via Gemini (extraindo nome, descrição e análise
        pedagógica), casa automaticamente com os alunos da turma, gera relatórios
        do tipo 'atividade' para os trabalhos confirmados e descarta os arquivos originais
        imediatamente (LGPD).
      summary: Enviar trabalhos de alunos por foto/arquivo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este atividade.
        required: true
      tags:
      - atividades
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvioTrabalhosUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvioTrabalhosUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioTrabalhos'
          description: ''
        '400':
          description: Arquivos inválidos ou formato/tamanho não suportado.
        '404':
          description: Atividade não encontrada.
        '502':
          description: Falha ao comunicar com o provedor de IA.
  /api/atividades/extrair/:
    post:
      operationId: atividades_extrair_create
      description: Extrai arquivos em memória e sugere dados para a atividade.
      tags:
